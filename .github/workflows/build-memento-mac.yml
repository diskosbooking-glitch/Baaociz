name: Build Memento (macOS)

on:
  push:
    paths:
      - 'Memento/**'
      - '.github/workflows/build-memento-mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Memento AU + package .dmg
        run: bash Memento/ci/build_mac.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Memento-Mac
          path: Memento/build/*.dmg
          if-no-files-found: error
