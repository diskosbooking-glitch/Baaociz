name: Compilation Subshaper

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    name: Mac (AU + VST3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilation + installateur
        run: bash AocizSubShaper/ci/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Subshaper-Mac
          path: AocizSubShaper/out/*.pkg
